<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  body { font-family: Arial, sans-serif; width: 330px; padding: 12px; color: #1c1e21; margin: 0; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  #state { font-size: 12.5px; margin-bottom: 10px; color: #333; }
  button { width: 100%; padding: 9px; margin-top: 6px; font-size: 14px; cursor: pointer; }
  h2 { font-size: 13px; margin: 14px 0 6px; }
  #clients { max-height: 300px; overflow-y: auto; }
  .client { border: 1px solid #dddfe2; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; background: #f7f9fd; }
  .client .top { display: flex; justify-content: space-between; align-items: center; }
  .client .name { font-weight: bold; font-size: 13.5px; }
  .badge { background: #e7f0fe; color: #0b57a4; border-radius: 8px; padding: 1px 7px; font-size: 11px; white-space: nowrap; }
  .badge.ok { background: #e2f3e5; color: #146c2e; }
  .badge.warn { background: #fdecec; color: #a40b0b; }
  .client .data { font-size: 12px; color: #444; margin-top: 3px; }
  .empty { font-size: 12.5px; color: #65676b; }
</style>
</head>
<body>
<h1>🤖 Asesor Marketplace</h1>
<div id="state">…</div>
<button id="test">Probar aviso</button>
<button id="openOptions">Configuración</button>
<h2>Clientes en el embudo</h2>
<div id="clients"><span class="empty">Cargando…</span></div>
<script src="popup.js"></script>
</body>
</html>
